name: RG1 - XSDK prueba de video y control

on:
  workflow_dispatch:

jobs:
  xsdk-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Construir compilador PowerPC
        env:
          JOBS: '4'
        run: |
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" bash tools/toolchain/build.sh
          "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" --version

      - name: Compilar biblioteca y prueba de video
        run: |
          make -j2 build/libxsdk.a
          cmake -S samples/hello -B build/samples/hello -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/samples/hello
          test -s build/samples/hello/hello.xex
          file build/samples/hello/hello.xex

      - name: Guardar XEX de video
        uses: actions/upload-artifact@v4
        with:
          name: rg1-video-control-prueba
          path: build/samples/hello/hello.xex
          if-no-files-found: error
          retention-days: 7

      - name: Guardar registros si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rg1-video-registros-error
          path: |
            /home/runner/xsdk-gcc-work/logs/
            build/samples/hello/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
