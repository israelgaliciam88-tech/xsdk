
name: RG1 - Compilador XSDK y primera prueba

on:
  workflow_dispatch:

jobs:
  xsdk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar dependencias del compilador
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Construir compilador PowerPC para XSDK
        env:
          JOBS: '4'
        run: |
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" bash tools/toolchain/build.sh
          "$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-gcc" --version

      - name: Compilar primera prueba XEX
        run: |
          make -j2 build/probe_print.xex
          test -s build/probe_print.xex
          file build/probe_print.xex

      - name: Guardar XEX generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xsdk-primera-prueba
          path: build/probe_print.xex
          retention-days: 7

      - name: Guardar registros si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xsdk-registros-error
          path: ~/xsdk-gcc-work/logs/
          if-no-files-found: ignore
          retention-days: 7

